services:
  postgres:
    image: postgres:17
    container_name: intervai-postgres
    environment:
      POSTGRES_DB: intervai
      POSTGRES_USER: intervai
      POSTGRES_PASSWORD: intervai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: intervai-backend
    environment:
      DATABASE_URL: postgresql+psycopg://intervai:intervai_dev_password@postgres:5432/intervai
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
